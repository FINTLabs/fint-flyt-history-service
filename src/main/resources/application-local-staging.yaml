fint:
  org-id: fintlabs.no
  flyt:
    authorization:
      sso:
        client-id: local

novari:
  flyt:
    instance:
      database:
        schema: fintlabs_no_instance
    security:
      user:
        audience: local-frontend-client

  kafka:
    topic:
      org-id: fintlabs-no
      default-replicas: 1

spring:
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    hikari:
      schema: fintlabs_no
    url: jdbc:postgresql://localhost:5436/fint-flyt-history-service
    username: postgres
    password: password

server:
  port: 8083
